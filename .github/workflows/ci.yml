name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The whole suite is offline by design, so CI needs no secrets and no cloud
# credentials. If a test ever starts requiring the network, that is a bug in
# the test, not a reason to grant CI more access.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector is not optional here: this project's whole point is
      # concurrency correctness, and several of its tests only mean anything
      # when run under -race.
      - name: Test (race detector)
        run: go test -race ./...

      # Installed from source rather than via golangci-lint-action, which
      # downloads a prebuilt binary. A golangci-lint built with an older Go
      # than the module targets refuses to run:
      #
      #   the Go language version (go1.23) used to build golangci-lint is
      #   lower than the targeted Go version (1.24)
      #
      # Building it here guarantees it uses this job's toolchain. The version
      # is pinned so a linter release cannot break the build on its own.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: golangci-lint run ./...

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Runs each benchmark once, purely to prove they still compile and
      # execute. CI hardware is too noisy for the numbers to mean anything —
      # the figures in the README come from a known machine and say so.
      - name: Run benchmarks once
        run: go test -bench=. -benchtime=1x -run='^$' ./...
